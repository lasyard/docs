apiVersion: kamaji.clastix.io/v1alpha1
kind: TenantControlPlane
metadata:
  name: user-tcp
  namespace: tenant-ns
  labels:
    tenant.clastix.io: user-tcp
spec:
  dataStore: default
  controlPlane:
    deployment:
      replicas: 1
      registrySettings:
        registry: registry.aliyuncs.com/google_containers
        apiServerImage: kube-apiserver
        controllerManagerImage: kube-controller-manager
        schedulerImage: kube-scheduler
      additionalMetadata:
        labels:
          tenant.clastix.io: user-tcp
      extraArgs:
        apiServer: []
        controllerManager: []
        scheduler: []
      resources: {}
    service:
      additionalMetadata:
        labels:
          tenant.clastix.io: user-tcp
      serviceType: NodePort
  kubernetes:
    version: v1.35.8
    kubelet:
      cgroupfs: systemd
    admissionControllers:
      - ResourceQuota
      - LimitRanger
  networkProfile:
    address: 10.225.4.51
    port: 30443
    certSANs:
      - las0
      - 10.220.70.56
    serviceCidr: 10.96.0.0/12
    podCidr: 192.168.0.0/16
    dnsServiceIPs:
      - 10.96.0.10
  addons:
    coreDNS: {}
    kubeProxy: {}
    konnectivity:
      server:
        port: 30132
