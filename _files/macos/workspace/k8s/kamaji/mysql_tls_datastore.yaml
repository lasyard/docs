apiVersion: kamaji.clastix.io/v1alpha1
kind: DataStore
metadata:
  name: mysql
spec:
  driver: MySQL
  endpoints:
    - las0:3306
  basicAuth:
    username:
      content: a2FtYWpp
    password:
      secretReference:
        name: mysql-secret
        namespace: mysql-system
        keyPath: password
  tlsConfig:
    certificateAuthority:
      certificate:
        secretReference:
          name: mysql-ca
          namespace: mysql-system
          keyPath: "tls.crt"
    clientCertificate:
      certificate:
        secretReference:
          name: kamaji-mysql-ca
          namespace: mysql-system
          keyPath: "tls.crt"
      privateKey:
        secretReference:
          name: kamaji-mysql-ca
          namespace: mysql-system
          keyPath: "tls.key"
